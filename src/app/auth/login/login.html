<div class="login-box">
  <h2>Teacher Login</h2>

  <input type="email" [(ngModel)]="email" placeholder="Email">
  <input type="password" [(ngModel)]="password" placeholder="Password">

  <button (click)="login()">Login</button>

  <p style="color:red">{{error}}</p>

  <p><b>Demo:</b> teacher@gmail.com / 12345</p>
</div>
